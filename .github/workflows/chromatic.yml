name: "Chromatic"

on:
  push:
    branches:
      - libs/** # Only run on library changes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v1
        with:
          node-version: "12.x"

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Run Chromatic
        env:
          CHROMATIC_TOKEN: ${{ secrets.CHROMATIC_TOKEN }}
        run: yarn chromatic --auto-accept-changes




