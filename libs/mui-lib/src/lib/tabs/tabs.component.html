@if ((asyncTabs | async) === null) {
  Loading tabs...
}

<mat-tab-group>
  @for (tab of asyncTabs | async; track tab) {
    <mat-tab>
      <ng-template mat-tab-label>{{tab.label}}</ng-template>
      <div class="tab-content">
        <ng-container *ngIf="tab.label !== 'Reviews'">
          {{ tab.content }}
        </ng-container>
        <ng-container *ngIf="tab.label === 'Reviews'">
          <ng-content></ng-content>
        </ng-container>
      </div>
    </mat-tab>
  }
</mat-tab-group>
