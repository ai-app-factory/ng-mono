
<p>
  <em>{{label}}</em>
</p>
<mat-form-field class="example-form-field">
  <mat-label>keywords</mat-label>
  <mat-chip-grid #chipGrid aria-label="Enter keywords" [formControl]="formControl">
    @for (keyword of _keywords(); track keyword) {
      <mat-chip-row (removed)="removeChip(keyword)">
        {{keyword}}
        <button matChipRemove aria-label="'remove ' + item.label">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
    }
  </mat-chip-grid>
  <input
    placeholder="New keyword..."
    [matChipInputFor]="chipGrid"
    (matChipInputTokenEnd)="addChip($event)"
  />
</mat-form-field>

<p><strong>You have entered:</strong> {{formControl.value}}</p>
