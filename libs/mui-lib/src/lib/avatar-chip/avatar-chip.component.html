<mat-chip-set aria-label="Dog selection">
  @if (removable) {
    @for (avatarChip of _avatarChips(); track avatarChip) {
      <mat-chip-row
        [disabled]="disabled"
        removable="true"
        (removed)="removeChip(avatarChip)"
        [ngClass]="size"
      >
        <img
          matChipAvatar
          [src]="avatarChip.avatarUrl"
          [alt]="avatarChip.alt"
          [ngClass]="size"
        />
          {{avatarChip.label}}
        <button matChipRemove aria-label="'remove ' + keyword">
          <mat-icon>cancel</mat-icon>
        </button>
      </mat-chip-row>
    }
  }
  @else {
    @for (avatarChip of _avatarChips(); track avatarChip) {
      <mat-chip-row
        [disabled]="disabled"
        removable="false"
        (removed)="removeChip(avatarChip)"
        [ngClass]="size"
      >
        <img
          matChipAvatar
          [src]="avatarChip.avatarUrl"
          [alt]="avatarChip.alt"
          [ngClass]="size"
        />
          {{avatarChip.label}}
      </mat-chip-row>
    }
  }
</mat-chip-set>
