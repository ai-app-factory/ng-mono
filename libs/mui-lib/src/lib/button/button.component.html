<div>
  @switch (buttonType) {
    @case ('mat-raised-button') {
      <button
        mat-raised-button
        [disabled]="disabled"
        [disableRipple]="disableRipple"
        [disabledInteractive]="disabledInteractive"
        (click)="onButtonPress()"
        [ngClass]="size"
      >
        {{label}}
      </button>
    }
    @case ('mat-flat-button') {
      <button
        mat-flat-button
        [disabled]="disabled"
        [disableRipple]="disableRipple"
        [disabledInteractive]="disabledInteractive"
        (click)="onButtonPress()"
        [ngClass]="size"
      >
        {{label}}
      </button>
    }
    @case ('mat-button') {
      <button
        mat-button
        [disabled]="disabled"
        [disableRipple]="disableRipple"
        [disabledInteractive]="disabledInteractive"
        (click)="onButtonPress()"
        [ngClass]="size"
      >
        {{label}}
      </button>
    }
    @case ('mat-fab') {
      <button
        mat-fab
        [disabled]="disabled"
        [disableRipple]="disableRipple"
        [disabledInteractive]="disabledInteractive"
        (click)="onButtonPress()"
        [ngClass]="size"
      >
        <mat-icon
          aria-hidden="false"
          aria-label="Example home icon"
          [fontIcon]="icon"
        ></mat-icon>
      </button>
    }
    @case ('mat-mini-fab') {
      <button
        mat-mini-fab
        [disabled]="disabled"
        (click)="onButtonPress()"
        [ngClass]="size"
      >
        <mat-icon
          aria-hidden="false"
          aria-label="Example home icon"
          [fontIcon]="icon"
        ></mat-icon>
      </button>
    }
    @case ('mat-stroked-button') {
      <button
        mat-stroked-button
        [disabled]="disabled"
        [disableRipple]="disableRipple"
        [disabledInteractive]="disabledInteractive"
        (click)="onButtonPress()"
        [ngClass]="size">
        {{label}}
      </button>
    }
    @case ('mat-icon-button') {
      <button
        mat-icon-button
        [disabled]="disabled"
        [disableRipple]="disableRipple"
        [disabledInteractive]="disabledInteractive"
        (click)="onButtonPress()"
        [ngClass]="size"
      >
        <mat-icon
          aria-hidden="false"
          aria-label="Example home icon"
          [fontIcon]="icon"
        ></mat-icon>
      </button>
    }
  }
</div>
