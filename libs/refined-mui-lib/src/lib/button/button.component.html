@switch (buttonType) {
  @case ('mat-raised-button') {
    <button
      mat-raised-button
      [disabled]="disabled"
      [disableRipple]="disableRipple"
      [disabledInteractive]="disabledInteractive"
      (click)="onButtonPress()"
    >
      {{ label }}
    </button>
  }
  @case ('mat-flat-button') {
    <button
      mat-flat-button
      [disabled]="disabled"
      [disableRipple]="disableRipple"
      [disabledInteractive]="disabledInteractive"
      (click)="onButtonPress()"
    >
      {{ label }}
    </button>
  }
  @case ('mat-stroked-button') {
    <button
      mat-stroked-button
      [disabled]="disabled"
      [disableRipple]="disableRipple"
      [disabledInteractive]="disabledInteractive"
      (click)="onButtonPress()"
    >
      {{ label }}
    </button>
  }
  @case ('mat-icon-button') {
    <button
      mat-icon-button
      [disabled]="disabled"
      [disableRipple]="disableRipple"
      [disabledInteractive]="disabledInteractive"
      (click)="onButtonPress()"
    >
      <mat-icon>{{ icon }}</mat-icon>
    </button>
  }
  @case ('mat-fab') {
    <button
      mat-fab
      [disabled]="disabled"
      [disableRipple]="disableRipple"
      [disabledInteractive]="disabledInteractive"
      (click)="onButtonPress()"
    >
      <mat-icon>{{ icon }}</mat-icon>
    </button>
  }
  @case ('mat-mini-fab') {
    <button
      mat-mini-fab
      [disabled]="disabled"
      [disableRipple]="disableRipple"
      [disabledInteractive]="disabledInteractive"
      (click)="onButtonPress()"
    >
      <mat-icon>{{ icon }}</mat-icon>
    </button>
  }
  @case ('mat-button') {
    <button
      mat-button
      [disabled]="disabled"
      [disableRipple]="disableRipple"
      [disabledInteractive]="disabledInteractive"
      (click)="onButtonPress()"
    >
      {{ label }}
    </button>
  }
  @case ('mat-menu-item') {
    <button
      mat-menu-item
      [disabled]="disabled"
      (click)="onButtonPress()"
    >
      @if (icon) {
        <mat-icon>{{ icon }}</mat-icon>
        <span>{{ label }}</span>
      }
      @else {
        {{ label }}
      }
    </button>
  }
}
