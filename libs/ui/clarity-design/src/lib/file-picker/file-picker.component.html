<body cds-theme="light">
<form clrForm [clrLayout]="layout" [formGroup]="form">
    <clr-file-input-container [clrButtonLabel]="label">
      <label>File</label>
      <input
        type="file"
        clrFileInput
        [accept]="accept"
        [multiple]="multiple"
        [clrMinFileSize]="minFileSize ? minFileSize : 0"
        [clrMaxFileSize]="maxFileSize ? maxFileSize : 0"
        [required]="required"
        [formControl] = "formControl"
      />
      <clr-control-helper>{{ helperText }}</clr-control-helper>
      <clr-control-success>Success message</clr-control-success>
      <clr-control-error>Error message</clr-control-error>
    </clr-file-input-container>
  </form>
  </body>
