<mat-form-field>
    <mat-label>{{ label }}</mat-label>
    <input matInput [formControl]="formControl" [matTimepicker]="picker" [matTimepickerMin]="min" [matTimepickerMax]="max">
    <mat-timepicker-toggle matSuffix [for]="picker">
      <mat-icon matTimepickerToggleIcon>{{ toggleIcon }}</mat-icon>
    </mat-timepicker-toggle>
    <mat-timepicker [interval]="interval" [options]="options" #picker></mat-timepicker>
    <mat-error *ngIf="formControl.errors?.['matTimepickerParse']">Value isn't a valid time</mat-error>
    <mat-error *ngIf="formControl.errors?.['matTimepickerMin']">Value is too early</mat-error>
    <mat-error *ngIf="formControl.errors?.['matTimepickerMax']">Value is too late</mat-error>
  </mat-form-field>
