<div class="mat-elevation-z8">

  <table mat-table [dataSource]="dataSource!" matSort (matSortChange)="announceSortChange($event)">
    @for (coloum of displayedColumns; track coloum) {
      <ng-container matColumnDef="{{coloum}}">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> {{coloum}} </th>
        <td mat-cell *matCellDef="let element"> {{element[coloum]}} </td>
      </ng-container>
    }
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  @if (withPaginator) {
    <mat-paginator
      [pageSizeOptions]="pageSizeOptions? pageSizeOptions : [5, 10, 20]"
      showFirstLastButtons
      aria-label="Select page of periodic elements">
    </mat-paginator>
  }
</div>
