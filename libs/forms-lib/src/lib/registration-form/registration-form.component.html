<form class="registration-form">
  <div class="form-row">
    <lib-input
      label="First Name"
      placeholder="Enter your first name"
      [(value)]="firstName"
      (valueChange)="onFirstNameChange($event)"
    ></lib-input>

    <lib-input
      label="Last Name"
      placeholder="Enter your last name"
      [(value)]="lastName"
      (valueChange)="onLastNameChange($event)"
      class="example-full-width"
    ></lib-input>
  </div>

  <div class="form-row">
    <lib-input
      label="Email"
      placeholder="Enter your email"
      [(value)]="email"
      (valueChange)="onEmailChange($event)"
    ></lib-input>

    <div class="phone-number-group">
      <lib-input
        label="Country Code"
        placeholder="+1"
        [(value)]="countryCode"
        (valueChange)="onCountryCodeChange($event)"
        class="country-code"
      ></lib-input>

      <lib-input
        label="Phone Number"
        placeholder="Enter your phone number"
        [(value)]="phoneNumber"
        (valueChange)="onPhoneNumberChange($event)"
      ></lib-input>
    </div>
  </div>

  <div class="form-row" >
    <lib-date-picker
      label="Birthdate"
      [(ngModel)]="birthDate"
      (ngModelChange)="onBirthDateChange($event)"
      class="flex-item"
    ></lib-date-picker>

    <lib-select
        [list]="educationLevels"
        label="Educational Qualifications"
        [(ngModel)]="educationLevel"
        (ngModelChange)="onEducationLevelChange($event)"
        class="flex-item"
    ></lib-select>
    </div> 
    <div class="form-row">
        <lib-chip
          label="Programming Languages That you would like to learn"
          [keywords]="programmingLanguages"
          (keywordsChange)="programmingLanguages = $event"
        ></lib-chip>
      </div>
    <div class="form-row" style="justify-content: center; margin-top: 20px;">
        <lib-slide-toggle
          label="Accept Terms and Conditions"
          [(checked)]="agreeTerms"
          (checkedChange)="onAgreeTermsChange($event)"
        ></lib-slide-toggle>
    </div>
    <div class="form-row" style="justify-content: center; margin-top: 20px;">
        <lib-button
          label="Register"
          [buttonType]="'mat-raised-button'"
          (buttonClick)="registerUser()"
        ></lib-button>
    </div>


</form>
